<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Word Pulse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            overscroll-behavior-y: none;
            touch-action: manipulation;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        @keyframes wordFound {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .animate-pop { animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-shake { animation: shake 0.4s ease-in-out; }
        .animate-found { animation: wordFound 0.4s ease-out; }

        .letter-slot { transition: all 0.3s ease-in-out; }

        .toast-enter { opacity: 0; transform: translateY(20px); }
        .toast-enter-active { opacity: 1; transform: translateY(0); transition: opacity 300ms, transform 300ms; }
        .toast-exit { opacity: 1; }
        .toast-exit-active { opacity: 0; transition: opacity 300ms; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        * { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }

        :root { --base-tile: 30px; }
        #word-lists-area { align-content: center; }

        .letter-slot {
            width: var(--base-tile);
            height: calc(var(--base-tile) * 1.25);
            font-size: calc(var(--base-tile) * 0.7);
            border-width: max(2px, calc(var(--base-tile) * 0.06));
            border-style: solid;
        }

        .word-container {
            gap: calc(var(--base-tile) * 0.15);
            margin-right: calc(var(--base-tile) * 0.8);
            margin-bottom: calc(var(--base-tile) * 0.8);
        }

        .length-badge {
            width: calc(var(--base-tile) * 0.9);
            height: calc(var(--base-tile) * 0.9);
            font-size: calc(var(--base-tile) * 0.45);
            margin-right: calc(var(--base-tile) * 0.4);
            margin-bottom: calc(var(--base-tile) * 0.8);
        }
    </style>
</head>

        // 2. THE GENERATOR ENGINE
        function canFormWord(testWord, rootLetters) {
            let available = [...rootLetters];
            for (let char of testWord) {
                let idx = available.indexOf(char);
                if (idx === -1) return false;
                available.splice(idx, 1);
            }
            return true;
        }

        function generateRandomPuzzle() {
    const sixLetterWords = DICTIONARY.filter(w => w.length === 6);
    let bestPuzzle = null;
    let maxAnswers = 0;
    let attempts = 0;

    while (attempts < 100) {
        let root = sixLetterWords[Math.floor(Math.random() * sixLetterWords.length)];
        let rootLetters = root.split('');
        
        let answers = DICTIONARY.filter(w => canFormWord(w, rootLetters));
        
        // If it finds a perfect puzzle, serve it immediately
        if (answers.length >= 8) {
            return { root: root, words: answers };
        }
        
        // Otherwise, remember the best one it found so far
        if (answers.length > maxAnswers) {
            maxAnswers = answers.length;
            bestPuzzle = { root: root, words: answers };
        }
        attempts++;
    }
    
    // If it couldn't hit the threshold after 100 tries, serve the best possible option
    return bestPuzzle;
}

        function shuffleArray(array) {
            let curId = array.length;
            while (0 !== curId) {
                let randId = Math.floor(Math.random() * curId);
                curId -= 1;
                let tmp = array[curId];
                array[curId] = array[randId];
                array[randId] = tmp;
            }
            return array;
        }

        function initGame() {
            // Generate a fresh puzzle on the fly!
            gameState.puzzle = generateRandomPuzzle();
            
            const chars = gameState.puzzle.root.split('');
            shuffleArray(chars);
            gameState.scrambledLetters = chars.map((char, index) => ({ char, id: index, used: false }));
            
            gameState.foundWords.clear();
            gameState.score = 0;
            gameState.currentInput = [];
            gameState.timeLeft = gameState.duration;
            gameState.isGameOver = false;
            gameState.isPaused = false;
            DOM.score.innerText = '0';
            DOM.quitText.innerText = 'Quit Puzzle';
            
            buildDynamicGrid();
            renderLetterBoard();
            renderInputDisplay();
            startTimer();
            updateTimerUI();
        }

        function buildDynamicGrid() {
            DOM.wordListsArea.innerHTML = '';
            gameState.gridElements = {};
            
            const grouped = {};
            gameState.puzzle.words.forEach(w => {
                if(!grouped[w.length]) grouped[w.length] = [];
                grouped[w.length].push(w);
            });

            Object.keys(grouped).sort((a,b)=>a-b).forEach(len => {
                grouped[len].sort();
                
                const badge = document.createElement('div');
                badge.className = `length-badge flex items-center justify-center font-bold shrink-0 rounded-full bg-slate-800 text-purple-400 border border-slate-700 shadow-sm`;
                badge.innerText = len;
                DOM.wordListsArea.appendChild(badge);

                grouped[len].forEach(word => {
                    const wordContainer = document.createElement('div');
                    wordContainer.className = 'word-container flex transition-all';
                    wordContainer.id = `slot-${word}`;

                    for(let i=0; i<word.length; i++) {
                        const letterBox = document.createElement('div');
                        letterBox.className = `letter-slot flex items-center justify-center text-transparent transition-all duration-300 shrink-0 font-bold border-slate-600 bg-slate-800 rounded-md`;
                        letterBox.innerText = word[i];
                        wordContainer.appendChild(letterBox);
                    }
                    
                    gameState.gridElements[word] = wordContainer;
                    DOM.wordListsArea.appendChild(wordContainer);
                });
            });
            
            calculateAndApplyGridScale(grouped);
        }

        function calculateAndApplyGridScale(grouped) {
            if (!DOM.gridWrapper) return;
            const style = window.getComputedStyle(DOM.gridWrapper);
            
            const padLeft = parseFloat(style.paddingLeft) || 0;
            const padRight = parseFloat(style.paddingRight) || 0;
            const padTop = parseFloat(style.paddingTop) || 0;
            const padBottom = parseFloat(style.paddingBottom) || 0;
            
            const W = DOM.gridWrapper.clientWidth - padLeft - padRight;
            const H = DOM.gridWrapper.clientHeight - padTop - padBottom;

            if (W <= 0 || H <= 0) return;

            let min = 15;
            let max = 80;
            let best = min;

            while (min <= max) {
                let mid = Math.floor((min + max) / 2);
                if (canFitGrid(mid, W, H, grouped)) {
                    best = mid;
                    min = mid + 1;
                } else {
                    max = mid - 1;
                }
            }
            document.documentElement.style.setProperty('--base-tile', `${best}px`);
        }

        function canFitGrid(S, W, H, grouped) {
            const tileWidth = S;
            const tileHeight = S * 1.25;
            const letterGap = S * 0.15;
            const wordMarginRight = S * 0.8;
            const wordMarginBottom = S * 0.8;
            const badgeWidth = S * 0.9;
            const badgeMarginRight = S * 0.4;
            
            const rowHeight = tileHeight + wordMarginBottom;
            
            let currentX = 0;
            let currentY = 0;
            
            const lengths = Object.keys(grouped).sort((a,b)=>a-b);
            for (let lenIdx = 0; lenIdx < lengths.length; lenIdx++) {
                const len = lengths[lenIdx];
                const words = grouped[len];
                
                let badgeTotalW = badgeWidth + badgeMarginRight;
                if (currentX + badgeWidth > W && currentX > 0) {
                    currentX = 0;
                    currentY += rowHeight;
                }
                currentX += badgeTotalW;
                
                for (let i = 0; i < words.length; i++) {
                    const word = words[i];
                    const wordW = (word.length * tileWidth) + ((word.length - 1) * letterGap);
                    const totalItemW = wordW + wordMarginRight;
                    
                    if (currentX + wordW > W && currentX > 0) {
                        currentX = 0;
                        currentY += rowHeight;
                        if (wordW > W) return false; 
                    }
                    currentX += totalItemW;
                }
            }
            currentY += rowHeight; 
            return currentY <= H;
        }

        function renderLetterBoard() {
            DOM.letterBoard.innerHTML = '';
            gameState.scrambledLetters.forEach(item => {
                const btn = document.createElement('button');
                btn.className = `w-16 h-16 sm:w-18 sm:h-18 md:w-20 md:h-20 rounded-xl text-3xl md:text-4xl font-black transition-all flex items-center justify-center touch-manipulation select-none border-b-4 active:border-b-0 active:translate-y-[4px] ${
                    item.used 
                    ? 'bg-slate-900 text-slate-800 border-slate-950 opacity-50 cursor-default' 
                    : 'bg-slate-800 text-purple-300 border-slate-950 cursor-pointer shadow-lg hover:bg-slate-700'
                }`;
                btn.innerText = item.char;
                btn.addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    handleLetterClick(item);
                });
                DOM.letterBoard.appendChild(btn);
            });
        }

        function renderInputDisplay() {
            DOM.inputDisplay.innerHTML = '';
            if (gameState.currentInput.length === 0) {
                DOM.inputDisplay.innerHTML = `<div class="text-slate-600/70 font-medium tracking-wider text-[10px] md:text-xs flex items-center gap-2">TYPE OR TAP TO SPELL</div>`;
                return;
            }
            gameState.currentInput.forEach(item => {
                const box = document.createElement('div');
                box.className = 'w-9 h-11 md:w-11 md:h-12 bg-purple-600 text-white rounded-lg flex items-center justify-center font-bold text-xl md:text-2xl shadow-md border border-purple-500 animate-pop cursor-pointer active:bg-purple-700 touch-manipulation';
                box.innerText = item.char;
                box.onclick = () => removeLetterFromInput(item);
                DOM.inputDisplay.appendChild(box);
            });
        }

        function handleLetterClick(item) {
            if (item.used || gameState.isGameOver || gameState.isPaused) return;
            item.used = true;
            gameState.currentInput.push(item);
            renderLetterBoard();
            renderInputDisplay();
        }

        function removeLetterFromInput(itemToRemove) {
            const idx = gameState.currentInput.indexOf(itemToRemove);
            if (idx > -1) {
                const removed = gameState.currentInput.splice(idx);
                removed.forEach(i => i.used = false);
                renderLetterBoard();
                renderInputDisplay();
            }
        }

        function handleBackspace() {
            if (gameState.currentInput.length > 0) {
                const item = gameState.currentInput.pop();
                item.used = false;
                renderLetterBoard();
                renderInputDisplay();
            }
        }

        function handleClear() {
            gameState.currentInput.forEach(i => i.used = false);
            gameState.currentInput = [];
            renderLetterBoard();
            renderInputDisplay();
        }

        function handleShuffle() {
            if (gameState.isGameOver || gameState.isPaused) return;
            shuffleArray(gameState.scrambledLetters);
            renderLetterBoard();
        }

        function handleSubmit() {
            if (gameState.isGameOver) return;
            
            if (gameState.currentInput.length < 3) {
                if (gameState.currentInput.length > 0) showToast("Too short", "error");
                handleClear();
                return;
            }

            const word = gameState.currentInput.map(i => i.char).join('');
            
            if (gameState.puzzle.words.includes(word)) {
                if (gameState.foundWords.has(word)) {
                    showToast("Already found", "warning");
                    DOM.inputDisplay.classList.add('animate-shake');
                    setTimeout(() => DOM.inputDisplay.classList.remove('animate-shake'), 400);
                } else {
                    gameState.foundWords.add(word);
                    updateScore(word);
                    revealWordInGrid(word);
                    
                    if (word.length === 6) showToast("Pangram! +100", "gold");
                    
                    if (gameState.foundWords.size === gameState.puzzle.words.length) {
                        showToast("Puzzle Complete!", "gold");
                        endGame(true);
                    }
                }
            } else {
                showToast("Not in word list", "error");
                DOM.inputDisplay.classList.add('animate-shake');
                setTimeout(() => DOM.inputDisplay.classList.remove('animate-shake'), 400);
            }
            handleClear();
        }

        function updateScore(word) {
            let pts = 0;
            if (word.length === 3) pts = 10;
            else if (word.length === 4) pts = 20;
            else if (word.length === 5) pts = 30;
            else if (word.length === 6) pts = 100;
            
            gameState.score += pts;
            if (gameState.foundWords.size === gameState.puzzle.words.length) gameState.score += 100;
            DOM.score.innerText = gameState.score;
        }

        function revealWordInGrid(word, isMissed = false) {
            const container = gameState.gridElements[word];
            if (container) {
                const children = container.children;
                for (let i = 0; i < children.length; i++) {
                    children[i].classList.remove('bg-slate-800', 'border-slate-600', 'text-transparent');
                    
                    if (isMissed) {
                        children[i].classList.add('bg-rose-950/70', 'border-rose-900', 'text-rose-500');
                    } else {
                        if (word.length === 6) { 
                            children[i].classList.add('bg-amber-500', 'border-amber-400', 'text-slate-950', 'animate-found');
                        } else { 
                            children[i].classList.add('bg-emerald-600', 'border-emerald-500', 'text-white', 'animate-found');
                        }
                    }
                }
            }
        }

        function startTimer() {
            clearInterval(gameState.timerInterval);
            gameState.timerInterval = setInterval(() => {
                if (!gameState.isPaused && !gameState.isGameOver) {
                    gameState.timeLeft--;
                    updateTimerUI();
                    if (gameState.timeLeft <= 0) endGame(false);
                }
            }, 1000);
        }

        function updateTimerUI() {
            const m = Math.floor(gameState.timeLeft / 60);
            const s = gameState.timeLeft % 60;
            DOM.timer.innerText = `${m}:${s.toString().padStart(2, '0')}`;
            if (gameState.timeLeft <= 10 && gameState.timeLeft > 0) {
                DOM.timer.classList.add('text-rose-500');
                DOM.timer.classList.remove('text-slate-200');
            } else {
                DOM.timer.classList.remove('text-rose-500');
                DOM.timer.classList.add('text-slate-200');
            }
        }

        function handleQuit() {
            if (gameState.isGameOver) {
                initGame(); 
            } else {
                endGame(false, true); 
            }
        }

        function endGame(won, quit = false) {
            gameState.isGameOver = true;
            clearInterval(gameState.timerInterval);
            saveHighScore(gameState.score);
            handleClear();

            DOM.quitText.innerText = 'Next Puzzle';
            DOM.btnQuit.classList.replace('bg-slate-950', 'bg-purple-900/30');
            DOM.btnQuit.classList.replace('text-slate-400', 'text-purple-300');
            DOM.btnQuit.classList.replace('border-slate-800', 'border-purple-800/50');
            DOM.btnQuit.classList.add('animate-pop');
            setTimeout(()=> DOM.btnQuit.classList.remove('animate-pop'), 300);

            const missed = gameState.puzzle.words.filter(w => !gameState.foundWords.has(w));
            missed.forEach(w => revealWordInGrid(w, true));

            if (quit) {
                showToast("Puzzle Quit. Missed words revealed.", "info");
            } else if (!won) {
                showToast("Time's up!", "warning");
            }
        }

        function openModal(modal, content) {
            gameState.isPaused = true;
            modal.classList.remove('hidden');
            void modal.offsetWidth;
            modal.classList.remove('opacity-0');
            content.classList.remove('scale-95');
        }

        function closeModal(modal, content) {
            modal.classList.add('opacity-0');
            content.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                if(!gameState.isGameOver) gameState.isPaused = false;
            }, 300);
        }

        function showToast(message, type="info") {
            const toast = document.createElement('div');
            let bg = 'bg-slate-800 text-slate-100 border border-slate-700';
            if(type === 'error') bg = 'bg-rose-950 text-rose-200 border border-rose-900';
            if(type === 'success') bg = 'bg-emerald-600 text-white border border-emerald-500 shadow-md';
            if(type === 'gold') bg = 'bg-amber-500 text-slate-950 border border-amber-400 shadow-md font-bold';
            if(type === 'warning') bg = 'bg-amber-600 text-white border border-amber-500';
            if(type === 'info') bg = 'bg-purple-900/90 text-purple-100 border border-purple-800 shadow-md';

            toast.className = `${bg} px-5 py-3 rounded-xl font-bold text-sm md:text-base transition-all toast-enter backdrop-blur-md`;
            toast.innerText = message;
            DOM.toastContainer.appendChild(toast);
            
            requestAnimationFrame(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-enter-active');
            });

            setTimeout(() => {
                toast.classList.remove('toast-enter-active');
                toast.classList.add('toast-exit-active');
                setTimeout(() => toast.remove(), 300);
            }, 1500);
        }

        DOM.btnShuffle.addEventListener('click', handleShuffle);
        DOM.btnBackspace.addEventListener('click', handleBackspace);
        DOM.btnClear.addEventListener('click', handleClear);
        DOM.btnEnter.addEventListener('click', handleSubmit);
        DOM.btnQuit.addEventListener('click', handleQuit);
        
        DOM.btnSettings.addEventListener('click', () => openModal(DOM.modalSettings, DOM.modalSettingsContent));
        DOM.btnCloseSettings.addEventListener('click', () => closeModal(DOM.modalSettings, DOM.modalSettingsContent));

        let lastGridWidth = 0;
        let resizeDebounce = null;
        gridResizeObserver = new ResizeObserver((entries) => {
            if (!gameState.puzzle || entries.length === 0) return;
            const newWidth = entries[0].contentRect.width;
            
            if (Math.abs(newWidth - lastGridWidth) > 5) {
                lastGridWidth = newWidth;
                clearTimeout(resizeDebounce);
                resizeDebounce = setTimeout(() => {
                    const grouped = {};
                    gameState.puzzle.words.forEach(w => {
                        if(!grouped[w.length]) grouped[w.length] = [];
                        grouped[w.length].push(w);
                    });
                    calculateAndApplyGridScale(grouped);
                }, 150);
            }
        });
        if (DOM.gridWrapper) {
            lastGridWidth = DOM.gridWrapper.getBoundingClientRect().width;
            gridResizeObserver.observe(DOM.gridWrapper);
        }

        DOM.settingTimeBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                DOM.settingTimeBtns.forEach(b => {
                    b.classList.remove('border-purple-500', 'bg-purple-900/30', 'text-purple-300', 'border-2');
                    b.classList.add('border-slate-700', 'bg-slate-800', 'text-slate-300', 'border');
                });
                const target = e.target;
                target.classList.remove('border-slate-700', 'bg-slate-800', 'text-slate-300', 'border');
                target.classList.add('border-purple-500', 'bg-purple-900/30', 'text-purple-300', 'border-2');
                
                gameState.duration = parseInt(target.getAttribute('data-time'));
                showToast("Timer updated for next game");
            });
        });

        document.addEventListener('keydown', (e) => {
            if (gameState.isPaused) return;
            
            const key = e.key.toUpperCase();
            if (key === 'ENTER') handleSubmit();
            else if (key === 'BACKSPACE') handleBackspace();
            else if (key === ' ' || e.code === 'Space') {
                handleShuffle();
                e.preventDefault();
            } else if (/^[A-Z]$/.test(key)) {
                if (gameState.isGameOver) return;
                const availableItem = gameState.scrambledLetters.find(item => item.char === key && !item.used);
                if (availableItem) handleLetterClick(availableItem);
                else {
                    DOM.inputDisplay.classList.remove('animate-shake');
                    void DOM.inputDisplay.offsetWidth;
                    DOM.inputDisplay.classList.add('animate-shake');
                }
            }
        });

        initGame();
    </script>
</body>
</html>
